name: Release

# 发布 GitHub Release：
# - 手动触发：Actions → Release → Run workflow，输入版本号（如 1.0.0）
#   （tag 已存在时校验其必须指向当前 HEAD，否则拒绝发布）
# - 或推送 v* tag 自动触发（版本号取 tag，去掉 v 前缀）
# 产物：release/DeepSeekHarness-DesktopShell.zip + SHA256SUMS.txt（x64）
# （一键安装 Install-FromGitHub.ps1 会下载这两个资产并强制校验 SHA256）

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $v = "${{ github.event.inputs.version }}".TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9._+-]+)?$') {
            Write-Error "Invalid version: $v"; exit 1
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved version: $v"

      - name: Run verify gate
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify.ps1

      - name: Build release package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Build-Release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Verify package contents
        shell: pwsh
        run: |
          $zip = 'release/DeepSeekHarness-DesktopShell.zip'
          $expected = 14
          $tmp = Join-Path $env:TEMP ('rel-verify-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $actual = @(Get-ChildItem -Path (Join-Path $tmp 'DeepSeek Harness DesktopShell') -File).Count
          if ($actual -ne $expected) { throw "zip file count $actual != $expected" }
          if (-not (Test-Path 'release/SHA256SUMS.txt')) { throw 'SHA256SUMS.txt missing' }
          Write-Host "Package verified ($actual files)."

      - name: Ensure tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $head = git rev-parse HEAD
          if (git rev-parse -q --verify "refs/tags/$tag") {
            $tagged = git rev-list -n 1 "refs/tags/$tag"
            if ($tagged -ne $head) {
              Write-Error "tag $tag 已存在且指向 $tagged，不等于当前 HEAD $head；拒绝把当前构建挂到旧 tag。"
              exit 1
            }
            Write-Host "tag $tag 已存在且指向当前 HEAD，继续发布。"
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
          }

      - name: Delete existing release for tag (re-publish support)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { Write-Error "无法删除已存在的 Release $tag"; exit 1 }
            Write-Host "已删除旧 Release $tag，将重建。"
          } else {
            Write-Host "Release $tag 不存在，跳过删除。"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DeepSeek Harness DesktopShell v${{ steps.version.outputs.version }}
          body: |
            安装：见仓库 README 的“一键安装”（引导命令钉在本 tag，并显式传入 Owner/Repo/Tag）。
            一键安装会下载本 Release 的 zip 与 SHA256SUMS.txt 并做完整性校验（SHA256 一致才继续）。
            本发布包面向 Windows 10/11 **x64**（WebView2Loader 为 win-x64 变体）。

            **第五轮审计修复**：读不到版本的现有 dsh 不再静默放行；外部已运行的 DSH 同样必须通过
            验证基线（rc.7）才允许附着；端口已打开时启动前兼容修复一律只读；健康检查缓存校验原
            PID 存活；PowerShell 插件管理与 C# 启动逻辑完全遵守 dshRunnerMode。
          generate_release_notes: true
          files: |
            release/DeepSeekHarness-DesktopShell.zip
            release/SHA256SUMS.txt

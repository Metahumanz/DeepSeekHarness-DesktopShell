name: Release

# 发布 GitHub Release：
# - 手动触发：Actions → Release → Run workflow，输入版本号（如 1.0.5）
#   （tag 已存在时校验其必须指向当前 HEAD，否则拒绝发布；Release 已存在直接失败）
# - 或推送 v* tag 自动触发（版本号取 tag，去掉 v 前缀）
# - 版本单一来源门禁：无论哪种触发方式，版本号必须等于仓库根目录 VERSION 文件，
#   不一致直接失败（防止手滑发错版本）。
# - 发布冻结：本工作流不再删除/覆盖已有 Release——发布前显式检查 `gh release view`，
#   已存在即失败（"禁止覆盖，请增加版本号"）。
# 产物：release/DeepSeekHarness-DesktopShell.zip + SHA256SUMS.txt（x64）
# （一键安装 Install-FromGitHub.ps1 会下载这两个资产并强制校验 SHA256）
#
# 冻结策略（2026-08-19 起）：已发布的 tag 不再覆盖发布——本工作流不再删除已有 Release；
# 若对某个已发布 tag 重新构建会因 Release 已存在而失败，这是有意行为。
# 后续修复请发新版本（如 v1.0.5）。
#
# 结构：build job 只读验证+构建（无写权限）；publish job 持有 contents:write，
# 负责打 tag 与创建 Release。所有 Actions 钉 commit SHA。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.5)'
        required: true
        default: '1.0.5'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803   # v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $v = "${{ github.event.inputs.version }}".TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9._+-]+)?$') {
            Write-Error "Invalid version: $v"; exit 1
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved version: $v"

      - name: Gate version against repo VERSION (single source)
        shell: pwsh
        run: |
          $repoVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($repoVersion -ne "${{ steps.version.outputs.version }}") {
            Write-Error "VERSION file ($repoVersion) does not match release version (${{ steps.version.outputs.version }}). Aborting."
            exit 1
          }
          Write-Host "version gate ok: $repoVersion"

      - name: Run verify gate (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify.ps1

      - name: Run verify gate (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell -NoProfile -File tests/verify.ps1 -SkipAnalyzer

      - name: Build release package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Build-Release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Verify package contents
        shell: pwsh
        run: |
          $zip = 'release/DeepSeekHarness-DesktopShell.zip'
          $tmp = Join-Path $env:TEMP ('rel-verify-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $root = Join-Path $tmp 'DeepSeek Harness DesktopShell'
          if (-not (Test-Path (Join-Path $root 'DeepSeekHarness.exe'))) { throw 'DeepSeekHarness.exe missing' }
          if (-not (Test-Path (Join-Path $root 'version.txt'))) { throw 'version.txt missing' }
          $actual = @(Get-ChildItem -Path $root -File).Count
          if (-not (Test-Path 'release/SHA256SUMS.txt')) { throw 'SHA256SUMS.txt missing' }
          Write-Host "Package verified ($actual files; Build-Release performed the authoritative expected-file check)."

      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f   # v6
        with:
          name: release-package
          path: |
            release/DeepSeekHarness-DesktopShell.zip
            release/SHA256SUMS.txt

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803   # v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $v = "${{ github.event.inputs.version }}".TrimStart('v')
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131   # v7
        with:
          name: release-package
          path: ./release/

      - name: Ensure tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $head = git rev-parse HEAD
          if (git rev-parse -q --verify "refs/tags/$tag") {
            $tagged = git rev-list -n 1 "refs/tags/$tag"
            if ($tagged -ne $head) {
              Write-Error "tag $tag 已存在且指向 $tagged，不等于当前 HEAD $head；拒绝把当前构建挂到旧 tag。"
              exit 1
            }
            Write-Host "tag $tag 已存在且指向当前 HEAD，继续发布。"
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
          }

      - name: Refuse to overwrite existing release
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view "$tag" --repo Metahumanz/DeepSeekHarness-DesktopShell 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release v${{ steps.version.outputs.version }} 已存在，禁止覆盖，请增加版本号。"
            exit 1
          }
          Write-Host "Release $tag 不存在，可以创建。"
          $LASTEXITCODE = 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228   # v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DeepSeek Harness DesktopShell v${{ steps.version.outputs.version }}
          body: |
            安装：见仓库 README 的“一键安装”（引导命令钉在本 tag，并显式传入 Owner/Repo/Tag）。
            一键安装会下载本 Release 的 zip 与 SHA256SUMS.txt 并做完整性校验（文件名与 SHA256
            同时匹配才继续）。
            本发布包面向 Windows 10/11 **x64**（WebView2Loader 为 win-x64 变体）。

            **v1.0.5 发布摘要**：DSH 0.1.1-rc.1 兼容认证与覆盖层修复
            - rc1 CLI/Web/桌面壳启动、后端重启、退出和覆盖层路径完成实测；rc1 支持 `--no-open`
            - rc1 加入 tested 版本和已知 `--no-open` 能力；默认/最低 DSH 仍为 0.1.0-rc.7
            - 修复覆盖层重启按钮可见但未绑定动作的历史 BUG，并保留 WebView2 边界
            - 本机真实 web Profile 的 23 个可移植插件逐项完成隔离 BootReady preflight，23/23 PASS；
              本地 link 浏览器桥接和未安装的历史插件不伪造测试结论
            - 36 项自动回归门禁与 PowerShell 5.1 兼容门禁；OAuth/系统浏览器流程仍按人工验收文档执行
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            release/DeepSeekHarness-DesktopShell.zip
            release/SHA256SUMS.txt

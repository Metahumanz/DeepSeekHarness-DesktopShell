name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803   # v6
        with:
          fetch-depth: 0

      # PowerShell 7 跑完整源码门禁；5.1 只跑显式标记的宿主兼容套件。
      - name: Verify gate (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify.ps1

      - name: Verify gate (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell -NoProfile -File tests/verify.ps1 -Suite Ps51Compat -SkipAnalyzer

      - name: Build release package (C# compile + zip self-check)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Build-Release.ps1

      # Build-Release 已对 ZIP 的完整期望清单和 SHA256SUMS.txt 做权威自校验；
      # 普通 CI 不重复解压，也不上传只供 tag 发布工作流使用的临时 Release 工件。

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2

      # 统一门禁（tests/verify.ps1）：解析 + PSScriptAnalyzer + 六项回归测试
      - name: Verify gate (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify.ps1

      - name: Verify gate (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell -NoProfile -File tests/verify.ps1 -SkipAnalyzer

      - name: Build release package (C# compile + zip self-check)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Build-Release.ps1

      - name: Verify zip content
        shell: pwsh
        run: |
          $zip = 'release/DeepSeekHarness-DesktopShell.zip'
          $expected = 15
          $tmp = Join-Path $env:TEMP ('ci-verify-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $actual = @(Get-ChildItem -Path (Join-Path $tmp 'DeepSeek Harness DesktopShell') -File).Count
          if ($actual -ne $expected) { Write-Error "zip file count $actual != $expected"; exit 1 }
          if (-not (Test-Path 'release/SHA256SUMS.txt')) { Write-Error 'SHA256SUMS.txt missing'; exit 1 }
          Write-Host "zip content verified ($actual files)."

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: release-package
          path: |
            release/DeepSeekHarness-DesktopShell.zip
            release/SHA256SUMS.txt
